server {
    listen 80;
    listen [::]:80;
    server_name 24ir-shop.ru api.24ir-shop.ru admin.24ir-shop.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "IR Shop: SSL pending\n";
        add_header Content-Type text/plain;
    }
}
