x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: ir-shop-postgres
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    env_file:
      - ./api/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ir-shop

  redis:
    image: redis:7-alpine
    container_name: ir-shop-redis
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    env_file:
      - ./api/.env
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ir-shop

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      secrets:
        - api_env
    container_name: ir-shop-backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      API_PREFIX: api
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4444}:4444"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4444/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - ir-shop

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        API_URL: ${API_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_S3_HOST: ${NEXT_PUBLIC_S3_HOST}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-109559027}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: ir-shop-frontend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    env_file:
      - ./client/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://backend:4444/api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ir-shop

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: ir-shop-admin
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    env_file:
      - ./admin/.env
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ir-shop

volumes:
  postgres_data:
  redis_data:

secrets:
  api_env:
    file: ./api/.env

networks:
  ir-shop:
    name: ir-shop
    driver: bridge
